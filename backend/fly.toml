app = "flotadsp-backend"
primary_region = "cdg"

[build]

[env]
  DB_NAME = "flotadsp"
  # CORS_ORIGINS eliminado a propósito: el código aplica lista blanca segura por defecto.
  # Para ampliar dominios sin tocar código: flyctl secrets set CORS_ORIGINS="https://flotadsp.com,https://otro.com,..."
  GEMINI_MODEL = "gemini-1.5-flash"
  PUBLIC_BASE_URL = "https://flotadsp-backend.fly.dev"
  JWT_EXPIRE_HOURS = "72"
  ADMIN_NAME = "Administrador"
  # ⚠️ Todos los secretos van con: fly secrets set CLAVE=valor
  # SECRET_KEY, ADMIN_USERNAME, ADMIN_PASSWORD, GEMINI_API_KEY, MONGO_URL
  # R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY, R2_SECRET_KEY, R2_PUBLIC_URL

[mounts]
  source = "flotadsp_uploads"
  destination = "/app/uploads"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  kill_timeout = "90s"

  # OJO: aquí va /api/vivo y NO /api/health, a propósito.
  #
  # /api/health hace ping a Mongo. El 20-08-2026, al ampliar el plan de Atlas,
  # el clúster se quedó sin primario unos minutos y ese ping pasó a tardar los
  # 30 s de selección de servidor. Esta comprobación corta a los 5 s, Fly marcó
  # la máquina como enferma y dejó de mandarle tráfico: la aplicación ENTERA
  # caída, login incluido, y sin recuperarse sola cuando Mongo volvió. 2 h 26.
  #
  # Fly no pregunta "¿va todo bien?", pregunta "¿le mando peticiones a esta
  # máquina?". Esa pregunta la contesta /api/vivo, que no toca la base.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/vivo"

[[vm]]
  size = "shared-cpu-1x"
  # 1GB: con 512MB el procesado de imágenes (OpenCV/PIL, 5+ fotos por inspección)
  # iba al límite → lentitud y riesgo de muertes por memoria (OOM).
  memory = "1gb"
